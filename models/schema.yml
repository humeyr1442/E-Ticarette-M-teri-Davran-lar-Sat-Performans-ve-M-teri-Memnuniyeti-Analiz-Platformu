
version: 2

models:
  - name: stg_ecommerce_customers
    description: "Temizlenmiş müşteri verileri"
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

      - name: Payment_Method
        data_tests:
          - not_null

      - name: Product_Category
        data_tests:
          - not_null

      - name: Unit_Price
        data_tests:
          - not_null
